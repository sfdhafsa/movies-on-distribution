name: movies-on-distribution

services:
  docker:
    image: docker:29.10.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
      - jenkins-workspace:/var/jenkins_home/workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: movies-on-distribution/jenkins:2.580.3-docker29.10.1
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-workspace:/var/jenkins_home/workspace
      - docker-certs:/certs/client:ro
    restart: unless-stopped

volumes:
  docker-certs:
  docker-data:
  jenkins-home:
  jenkins-workspace:
